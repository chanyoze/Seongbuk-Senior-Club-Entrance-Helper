name: CI

# v2 푸시와 모든 PR에서 빌드+테스트를 자동 실행
on:
  push:
    branches: [ v2 ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest   # 테스트가 헤드리스 안전하므로 리눅스 러너로 충분 (exe 빌드는 CD에서 windows로)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew build --no-daemon
