name: Release

# 버전 태그(v1.0.0 등)를 push할 때만 실행 → 의도적인 릴리스
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # GitHub Release 생성 및 자산(zip) 업로드 권한

jobs:
  release:
    runs-on: windows-latest   # jpackage로 Windows .exe를 만들어야 하므로 windows 러너
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: Build native app-image (.exe + 내장 JRE)
        shell: pwsh
        run: .\gradlew.bat jpackageImage --no-daemon

      - name: Zip app-image
        shell: pwsh
        run: |
          # jpackage가 만든 실제 폴더를 직접 찾는다 (appname 재읽기 안 함 → 인코딩 문제 회피)
          $dir = Get-ChildItem build/jpackage -Directory | Select-Object -First 1
          if (-not $dir) { throw "app-image 폴더를 찾을 수 없습니다 (jpackage 실패?)" }
          # Compress-Archive 대신 tar(bsdtar) 사용 — 더 안정적. 버전 없는 고정 이름(릴리스 latest 링크용)
          tar -a -c -f EntranceHelper.zip -C build/jpackage -- $dir.Name
          $size = (Get-Item EntranceHelper.zip).Length
          Write-Host ("Created EntranceHelper.zip ({0:N1} MB)" -f ($size / 1MB))
          # 빈/깨진 zip이 릴리스되는 사고(이전 460byte) 재발 차단
          if ($size -lt 1MB) { throw "zip이 비정상적으로 작습니다 ($size bytes) - 내용 누락 의심" }

      - name: Create Release & upload zip
        uses: softprops/action-gh-release@v2
        with:
          files: EntranceHelper.zip
          generate_release_notes: true
